# Cubature's checks. Workbench runs them from a clean clone on Temurin 26 (`wb run ci.run project=cubature`), and
# its pre-push hook refuses a commit whose tree has not passed them. Without Workbench, `orthrus-tools actions run ci`
# runs the same jobs in a checkout. Builds and focused tests only: nothing here starts the game.
[settings]
name = "cubature"
workflow = "ci"
identity_files = ["{env.JAVA_HOME}/release"]

[interpreters]
# The tool tests' environment, made from tools/requirements.txt (Workbench builds and links it).
tools_python = [".local/ci-venv/bin/python", ".local/ci-venv/Scripts/python.exe"]

[workflows]
ci = ["inputs", "cleanroom", "lab", "tools"]

[jobs.inputs]
description = "Fetch the compile-only build inputs (Distant Horizons 3.3.3), checked by SHA-256"
steps = [{ name = "fetch", run = ["{python}", "-B", "tools/fetch_build_inputs.py"] }]

[jobs.cleanroom]
description = "Build Cubature and run its focused regressions on Java 26"
needs = ["inputs"]
locks = ["gradle"]
memory = 6
steps = [
  { name = "gradle", run = ["bash", "gradlew", "-PcubicTestJava=26", "build", "--no-daemon", "--console=plain"], cwd = "cleanroom" },
]

[jobs.lab]
description = "Build the measurement lab against this build and run its checks"
needs = ["cleanroom"]
locks = ["gradle"]
memory = 6
steps = [
  { name = "gradle", run = ["bash", "../cleanroom/gradlew", "build", "--no-daemon", "--console=plain"], cwd = "lab" },
]

[jobs.tools]
description = "Every Python tool test, in an environment made from tools/requirements.txt"
inputs = ["tools/*.py", "tools/requirements.txt"]
steps = [
  { name = "unittest", run = ["{tools_python}", "-B", "-m", "unittest", "discover", "-s", "tools", "-p", "test_*.py"] },
]

[[quick.cubature]]
paths = ["docs/**", "*.md", "license.txt", "HEADER.txt"]
jobs = []

[[quick.cubature]]
paths = ["tools/**"]
jobs = ["tools"]
