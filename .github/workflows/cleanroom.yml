name: Cleanroom and Forge port

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: cleanroom
            test-java: 26
          - loader: forge
            test-java: 8
    env:
      TOOLCHAINS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_26_X64
    steps:
      - uses: actions/checkout@v4
      # The last version listed becomes JAVA_HOME: Gradle runs on JDK 25; tests use 8 or 26.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            26
            25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch compile-only build inputs (DH 3.3.3, Demonica 0.9.0; SHA-256 checked)
        run: python -B tools/fetch_build_inputs.py
      - name: Build and run focused regressions
        working-directory: cleanroom
        run: >-
          bash gradlew -PcubicLoader=${{ matrix.loader }} -PcubicTestJava=${{ matrix.test-java }}
          $TOOLCHAINS build --console=plain
      - name: Build optional lab and run its focused checks
        working-directory: lab
        run: bash ../cleanroom/gradlew -PcubicLoader=${{ matrix.loader }} $TOOLCHAINS build --console=plain
      - name: Check native lab control code
        run: python -B -m unittest discover -s tools -p test_cubic_lab.py
      - uses: actions/upload-artifact@v4
        with:
          name: cubature-${{ matrix.loader }}
          path: |
            cleanroom/build/${{ matrix.loader }}/libs/*
            cleanroom/build/${{ matrix.loader }}/reports/tests/
            lab/build/${{ matrix.loader }}/libs/*
            lab/build/${{ matrix.loader }}/reports/tests/
