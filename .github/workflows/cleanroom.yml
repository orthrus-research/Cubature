name: Cleanroom build

# The shared Cleanroom workflow sets up Java 25 (JAVA_HOME) with a Java 26 toolchain, Python
# and Gradle, then runs actions.toml's `ci` workflow, the same jobs a local
# `orthrus-tools actions run ci` runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: orthrus-research/orthrus-tooling/.github/workflows/cleanroom.yml@v0.6.0
    with:
      artifact-name: cubature-cleanroom
      artifact-path: |
        cleanroom/build/cleanroom/libs/*
        cleanroom/build/cleanroom/reports/tests/
        lab/build/cleanroom/libs/*
        lab/build/cleanroom/reports/tests/
