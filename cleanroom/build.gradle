plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
}

group = 'cc.orthrus.cubature'
version = cubic_version
// Cleanroom on Java 25 or 26 is the only target; the Java 8 Forge fallback was retired on 2026-10-30.
def targetLoader = 'cleanroom'
def testJavaVersion = providers.gradleProperty('cubicTestJava').map { it.toInteger() }.getOrElse(25)
if (!(testJavaVersion in [25, 26])) {
    throw new GradleException('Cleanroom tests support Java 25/26')
}
base { archivesName = 'Cubature' }
layout.buildDirectory = layout.projectDirectory.dir("build/${targetLoader}")
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
sourceSets {
    buildSupport {
        java.srcDirs = ['src/buildSupport/java']
    }
    main {
        java.srcDirs = ['../src/main/java', '../CubicChunksAPI/src/main/java']
        resources.srcDirs = ['../src/main/resources', '../CubicChunksAPI/src/main/resources']
    }
    test {
        // Every test source compiles and runs; exclude one here only with the reason.
        java.srcDirs = ['../src/test/java']
    }
}
repositories {
    mavenCentral()
    maven {
        url = 'https://curse.cleanroommc.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://maven.daporkchop.net/'
        content { includeGroup 'io.github.opencubicchunks' }
    }
}
configurations {
    embeddedLibraries
    implementation.extendsFrom(embeddedLibraries)
}
// Distant Horizons and Demonica are compile-only inputs, never bundled. With a Riven workspace (RIVEN_WORKSPACE, else
// the sibling ../Riven) they come from its dev/pins; elsewhere tools/fetch_build_inputs.py downloads and verifies them
// into cleanroom/build-inputs.
def rivenPins = new File(providers.environmentVariable('RIVEN_WORKSPACE')
        .getOrElse(file('../../Riven').path), 'dev/pins')
def buildInputs = file(providers.gradleProperty('cubicBuildInputs')
        .getOrElse(rivenPins.isDirectory() ? rivenPins.path : 'build-inputs'))
// Celeritas ships inside Demonica's release jar; the cubic-section integration compiles against those exact classes.
def extractCeleritas = tasks.register('extractCeleritas', Copy) {
    from(zipTree(new File(buildInputs, 'Demonica-0.9.0.jar'))) { include 'zz-demonica-bundled-celeritas-*.jar' }
    into layout.buildDirectory.dir('celeritas')
}
dependencies {
    implementation cleanroom.userdev(cleanroom_version)
    // DH stays upstream on disk; Cubature supplies optional runtime transformations.
    compileOnly deobf(files(new File(buildInputs, 'DistantHorizons-3.3.3-1.12.2-forge.jar')))
    compileOnly fileTree(layout.buildDirectory.dir('celeritas')) { include '*.jar' }.builtBy(extractCeleritas)
    buildSupportCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly sourceSets.buildSupport.output
    // The legacy flow-noise embed is unused by both the mod and its API.
    embeddedLibraries('io.github.opencubicchunks:regionlib:0.78.0-20210527.114505-2') { transitive = false }
    testImplementation 'junit:junit:4.13.2'
}
// CleanMix emits shadow and overwrite member mappings separately from the injection refmap.
// Merge them with the loader mappings so the production JAR renames both sets.
def mixinMappings = layout.buildDirectory.file('generated/mixin/mcp2srg.tsrg')
tasks.named('compileJava', JavaCompile) {
    outputs.file(mixinMappings)
    options.compilerArgs += ['-AmergeBehaviour=merge', "-AoutTsrgFile=${mixinMappings.get().asFile.absolutePath}"]
    doFirst { mixinMappings.get().asFile.parentFile.mkdirs() }
}
tasks.named('reobfJar') {
    dependsOn tasks.compileJava
    map.setFrom(mixinMappings)
    archiveClassifier = targetLoader
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.register('verifyEmbeddedLibraries') {
    inputs.files(configurations.embeddedLibraries)
    doLast {
        def regionlib = configurations.embeddedLibraries.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(regionlib.bytes).encodeHex().toString()
        assert digest == '9b4d0f3c6dcb26694f7d347e2ddd4166d76db98f2c9df0dd500add2fd8aa71cd': 'RegionLib artifact differs from the verified maintainer publication'
    }
}
tasks.named('compileJava') { dependsOn tasks.named('verifyEmbeddedLibraries') }
processResources {
    inputs.property('version', project.version)
    filesMatching('mcmod.info') { filter { it.replace('%%VERSION%%', project.version.toString()) } }
    exclude 'log4j2.xml', 'assets/cubicchunks/logo.png'
}
jar {
    archiveClassifier = "${targetLoader}-dev"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'assets/cubicchunks/logo.png'
    from({ configurations.embeddedLibraries.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    manifest {
        attributes('Implementation-Title': 'Cubature',
                   'Implementation-Version': project.version,
                   'Implementation-Vendor': 'OpenCubicChunks contributors and Orthrus Research',
                   'FMLCorePlugin': 'io.github.opencubicchunks.cubicchunks.core.asm.coremod.CubicChunksCoreMod',
                   'FMLCorePluginContainsFMLMod': 'true',
                   'ForceLoadAsMod': 'true',
                   'MixinConnector': 'io.github.opencubicchunks.cubicchunks.core.asm.CubicChunksMixinConnector')
        attributes('ModType': 'CRL')
    }
}

// Source recipients need the same component terms and modification notices as binary recipients.
['jar', 'sourcesJar'].each { taskName ->
    tasks.named(taskName, Jar) {
        from('../license.txt') { into 'META-INF/licenses/cubicchunks' }
        from('licenses') { into 'META-INF/licenses' }
        from('../NOTICE.md')
        from('../MODIFICATIONS.md')
    }
}
tasks.named('test') {
    useJUnit()
    // Storage regressions exercise the actual named Minecraft Tuple class without booting a world.
    classpath += sourceSets.main.compileClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJavaVersion)
    }
    doFirst { logger.lifecycle("Focused regressions use Java ${javaLauncher.get().metadata.languageVersion}") }
}

// The focused lighting/config tests compile against the same named Minecraft and Mixin APIs as the mod.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
tasks.register('queuedCubeHashDiagnostic', JavaExec) {
    description = 'Export synthetic queue-key hash distributions; this is not a runtime benchmark.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.opencubicchunks.cubicchunks.core.server.chunkio.async.forge.QueuedCubeHashDiagnostic'
    javaLauncher = tasks.named('test').get().javaLauncher
}

tasks.register('heightMapAllocationDiagnostic', JavaExec) {
    description = 'Compare heightmap serialization allocations with the previous buffer sizing.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.opencubicchunks.cubicchunks.core.world.TestServerHeightMapSerialization'
    javaLauncher = tasks.named('test').get().javaLauncher
}

tasks.register('verifyReobfJar') {
    description = 'Check distributable class versions, embedded libraries, API names and Mixin resources.'
    group = 'verification'
    dependsOn tasks.named('reobfJar')
    inputs.files(tasks.named('reobfJar').map { it.outputs.files })
    inputs.file(mixinMappings)
    doLast {
        def artifact = tasks.named('reobfJar').get().outputs.files.singleFile
        new java.util.zip.ZipFile(artifact).withCloseable { archive ->
            def entries = archive.entries().toList()
            def names = entries.collect { it.name } as Set
            assert names.contains('cubicchunks/regionlib/impl/save/SaveSection3D.class'): 'Missing RegionLib'
            assert names.contains('META-INF/licenses/regionlib/LICENSE.txt'): 'Missing RegionLib license'
            assert !names.any { it.startsWith('org/spongepowered/asm/') }: 'Do not bundle Mixin'
            assert !names.any { it.startsWith('mcp/') }: 'Compile support must not ship'
            def ownClasses = entries.findAll {
                it.name.startsWith('io/github/opencubicchunks/') && it.name.endsWith('.class')
            }
            def expectedMajor = 69
            ownClasses.each { entry ->
                archive.getInputStream(entry).withCloseable { raw ->
                    def data = new DataInputStream(raw)
                    data.readInt()
                    data.readUnsignedShort()
                    assert data.readUnsignedShort() == expectedMajor: "Wrong bytecode target: ${entry.name}"
                }
            }
            def json = new groovy.json.JsonSlurper()
            def configs = entries.findAll { it.name.startsWith('cubicchunks.mixins.') && it.name.endsWith('.json') && !it.name.contains('refmap') }
            assert configs.size() == 7: 'Expected the four Mixin configurations and the three renderer-specific ones'
            configs.each { entry ->
                def config = json.parse(archive.getInputStream(entry))
                assert names.contains(config.refmap): "Missing refmap ${config.refmap}"
                ['mixins', 'client', 'server'].each { side ->
                    (config[side] ?: []).each { name ->
                        def mixinClass = "${config.package}.${name}"
                        assert names.contains(mixinClass.replace('.', '/') + '.class'): "Missing Mixin ${mixinClass}"
                    }
                }
            }
            def refmap = json.parse(archive.getInputStream(archive.getEntry('cubicchunks.mixins.refmap.json')))
            assert refmap.mappings && refmap.mappings.size() > 50: 'Empty or incomplete Mixin refmap'
            // A valid refmap does not prove that shadow and overwrite members in the packaged classes were renamed.
            def members = mixinMappings.get().asFile.readLines('UTF-8')
                    .findAll { it.startsWith('io/github/opencubicchunks/') }
                    .collect { it.trim().split(/\s+/) }
                    .findAll { it.length == 3 || it.length == 4 }
            assert members.size() > 100: 'No shadow or overwrite member mappings were emitted'
            members.groupBy { it[0] }.each { owner, mapped ->
                def node = new org.objectweb.asm.tree.ClassNode()
                new org.objectweb.asm.ClassReader(archive.getInputStream(archive.getEntry(owner + '.class'))).accept(node, 0)
                mapped.each { m ->
                    assert m.length == 3 ? node.fields.any { it.name == m[2] }
                            : node.methods.any { it.name == m[3] && it.desc == m[2] }: "Unmapped Mixin member: ${m.join(' ')}"
                }
            }
            def api = new org.objectweb.asm.tree.ClassNode()
            new org.objectweb.asm.ClassReader(archive.getInputStream(archive.getEntry('io/github/opencubicchunks/cubicchunks/api/world/IColumn.class'))).accept(api, 0)
            assert api.methods.any { it.name == 'getHeightValue' && it.desc == '(II)I' }: 'Remapping changed the public IColumn API'
            assert !api.methods.any { it.name == 'func_76611_b' }: 'Vanilla name leaked into IColumn API'
            logger.lifecycle("Verified ${artifact.name}: ${ownClasses.size()} mod/API classes, Java ${expectedMajor - 44}, ${configs.size()} Mixin configs, ${refmap.mappings.size()} refmap classes, ${members.size()} renamed Mixin members.")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyReobfJar') }
