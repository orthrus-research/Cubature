plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
}
group = 'io.github.opencubicchunks'
version = '0.1.0'
// Cleanroom on Java 25 or 26 is the only target; the Java 8 Forge fallback was retired on 2026-10-30.
def targetLoader = 'cleanroom'
def cubicProperties = new Properties()
file('../cleanroom/gradle.properties').withInputStream { cubicProperties.load(it) }
// -PcubicDevBuild selects the DEV-labeled Cubature build.
def cubicVersion = cubicProperties.cubic_version + (providers.gradleProperty('cubicDevBuild').isPresent() ? '-DEV' : '')
def cubicJar = file(providers.gradleProperty('cubicArtifact').getOrElse(
        "../cleanroom/build/${targetLoader}/libs/Cubature-${cubicVersion}-${targetLoader}.jar"))
if (!cubicJar.isFile()) throw new GradleException('Build the matching Cubature artifact under cleanroom/ first, or select -PcubicArtifact=<frozen.jar>')
// A content-addressed module keeps the deobfuscated copy fresh as the local fork changes.
def inputVersion = targetLoader + '-' + java.security.MessageDigest.getInstance('SHA-256').digest(cubicJar.bytes).encodeHex().toString()
def inputRepository = file('.gradle/lab-mod-inputs')
def inputJar = new File(inputRepository, "local/cubicchunks/CubicChunks/${inputVersion}/CubicChunks-${inputVersion}.jar")
if (!inputJar.exists()) { inputJar.parentFile.mkdirs(); java.nio.file.Files.copy(cubicJar.toPath(), inputJar.toPath()) }
base { archivesName = 'cubicchunks-lab' }
layout.buildDirectory = layout.projectDirectory.dir("build/${targetLoader}")
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
repositories {
    maven { url = inputRepository; content { includeGroup 'local.cubicchunks' }; metadataSources { artifact() } }
    mavenCentral(); maven { url = 'https://curse.cleanroommc.com' }; maven { url = 'https://maven.cleanroommc.com' }
}
// The Mixin annotation processor resolves the Distant Horizons classes the lod and delivery traces target.
// Same input as cleanroom/build.gradle: the release cleanroom/build-inputs.json pins, fetched into cleanroom/build-inputs
// by tools/fetch_build_inputs.py and checked against its hash before the lab compiles.
def buildInputs = file(providers.gradleProperty('cubicBuildInputs').getOrElse('../cleanroom/build-inputs'))
def verifyBuildInputs = tasks.register('verifyBuildInputs') {
    def pins = new groovy.json.JsonSlurper().parse(file('../cleanroom/build-inputs.json')).inputs
        .findAll { it.file.startsWith('DistantHorizons-') }.collectEntries { [(it.file): it.sha256] }
    def folder = buildInputs
    inputs.property('pins', pins)
    doLast {
        pins.each { name, expected ->
            def jar = new File(folder, name)
            if (!jar.isFile()) {
                throw new GradleException("Missing build input ${jar}: run python tools/fetch_build_inputs.py")
            }
            def found = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
            if (found != expected) {
                throw new GradleException("${jar} has SHA-256 ${found}; cleanroom/build-inputs.json pins ${expected}")
            }
        }
    }
}
dependencies {
    implementation cleanroom.userdev(cleanroom_version)
    compileOnly deobf("local.cubicchunks:CubicChunks:${inputVersion}")
    compileOnly deobf(files(new File(buildInputs, 'DistantHorizons-3.3.3-1.12.2-forge.jar')))
    testImplementation 'junit:junit:4.13.2'
}
// CleanMix emits shadow member mappings separately from the injection refmap; the reobf map needs both.
def mixinMappings = layout.buildDirectory.file('generated/mixin/mcp2srg.tsrg')
tasks.named('compileJava', JavaCompile) {
    dependsOn verifyBuildInputs
    outputs.file(mixinMappings)
    options.compilerArgs += ['-AmergeBehaviour=merge', "-AoutTsrgFile=${mixinMappings.get().asFile.absolutePath}"]
    doFirst { mixinMappings.get().asFile.parentFile.mkdirs() }
}
tasks.named('reobfJar') {
    dependsOn tasks.compileJava
    map.setFrom(mixinMappings)
    archiveClassifier = targetLoader
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    archiveClassifier = "${targetLoader}-dev"
    manifest {
        attributes('MixinConnector': 'io.github.opencubicchunks.cubicchunks.lab.LabMixinConnector',
            'Implementation-Version': project.version)
        attributes('ModType': 'CRL')
    }
    from('../license.txt') { into 'META-INF/licenses/cubicchunks-lab' }
}
tasks.named('test') {
    useJUnit()
    classpath += sourceSets.main.compileClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(26) }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
